services:
  postgres:
    image: postgres:16
    container_name: ozon-sjsq-cloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ozon_sjsq
      POSTGRES_PASSWORD: ozon_sjsq_dev
      POSTGRES_DB: ozon_sjsq_cloud
    ports:
      - "5432:5432"
    volumes:
      - ozon_sjsq_cloud_pgdata:/var/lib/postgresql/data

volumes:
  ozon_sjsq_cloud_pgdata:
